<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="t d"><title id="t">Universal Design for Learning: three principles</title><desc id="d">Three cards: Engagement, the why of learning; Representation, the what of learning; Action and expression, the how of learning.</desc><rect width="760" height="310" rx="14" fill="#FFFDEE"/><rect x="30" y="40" width="220" height="220" rx="14" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><circle cx="140" cy="104" r="38" fill="#F6E4EB"/><path d="M140 122 C 108 102, 122 74, 140 92 C 158 74, 172 102, 140 122 Z" fill="none" stroke="#8C013C" stroke-width="3.5" stroke-linejoin="round"/><text x="140" y="172" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#0A466B">Engagement</text><text x="140" y="196" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8C013C">The why of learning</text><text x="140" y="222" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#263232">Interest, effort and choice</text><rect x="270" y="40" width="220" height="220" rx="14" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><circle cx="380" cy="104" r="38" fill="#F6E4EB"/><path d="M354 104 Q 380 80 406 104 Q 380 128 354 104 Z" fill="none" stroke="#8C013C" stroke-width="3.5"/><circle cx="380" cy="104" r="8" fill="#8C013C"/><text x="380" y="172" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#0A466B">Representation</text><text x="380" y="196" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8C013C">The what of learning</text><text x="380" y="222" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#263232">Many ways to take in content</text><rect x="510" y="40" width="220" height="220" rx="14" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><circle cx="620" cy="104" r="38" fill="#F6E4EB"/><path d="M606 124 L 606 98 M606 102 L 606 86 M615 102 L 615 80 M624 102 L 624 84 M633 106 L 633 92 M606 124 Q 620 134 633 118 L 633 102 M606 106 L 598 98" fill="none" stroke="#8C013C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="172" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#0A466B">Action and expression</text><text x="620" y="196" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8C013C">The how of learning</text><text x="620" y="222" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#263232">Many ways to show learning</text><text x="380" y="290" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#112A50">Plan for the range of learners before the lesson, not after it fails them.</text></svg>
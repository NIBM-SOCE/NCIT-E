<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">The award ladder</title><desc id="d">Three levels of the NIBM Certified ICT Teacher award as rising steps: Essentials (NCIT-E, 3 credits), Associate (NCIT-A, 6 credits) and Professional (NCIT-P, 12 credits). Essentials is marked: you are here.</desc><rect width="760" height="320" rx="14" fill="#FFFDEE"/><rect x="40" y="175" width="210" height="125" rx="10" fill="#E6EEF3" stroke="#0A466B" stroke-width="1.8"/><text x="56" y="205" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#0A466B">Essentials</text><text x="56" y="225" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5E5E56">NCIT-E  |  3 credits</text><text x="56" y="249" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#263232">Matches Knowledge Acquisition</text><rect x="56" y="268" width="104" height="22" rx="11" fill="#8C013C"/><text x="108" y="283" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">You are here</text><rect x="275" y="125" width="210" height="175" rx="10" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><text x="291" y="155" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#0A466B">Associate</text><text x="291" y="175" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5E5E56">NCIT-A  |  6 credits</text><text x="291" y="199" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#263232">Matches Knowledge Deepening</text><rect x="510" y="75" width="210" height="225" rx="10" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><text x="526" y="105" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#0A466B">Professional</text><text x="526" y="125" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5E5E56">NCIT-P  |  12 credits</text><text x="526" y="149" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#263232">Matches Knowledge Creation</text><text x="40" y="34" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#112A50">Three levels, one ladder</text><text x="40" y="54" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5E5E56">21 credits across the three levels</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img" aria-labelledby="t d"><title id="t">The school ICT pathway and its national exams</title><desc id="d">Grades 6 to 9 study ICT as a curriculum subject with no national exam; Grades 10 and 11 lead to the G.C.E. Ordinary Level exam; Grades 12 and 13 lead to the G.C.E. Advanced Level exam. General Information Technology is for Advanced Level students who do not take ICT.</desc><rect width="760" height="296" rx="14" fill="#FFFDEE"/><rect x="30" y="30" width="225" height="150" rx="12" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><rect x="30" y="30" width="225" height="38" rx="12" fill="#545454"/><rect x="30" y="52" width="225" height="16" fill="#545454"/><text x="44" y="55" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Grades 6 to 9</text><text x="44" y="98" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#263232">Curriculum subject</text><text x="44" y="124" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5E5E56">No national exam</text><path d="M259 105 l 12 0 m -6 -6 l 6 6 l -6 6" fill="none" stroke="#545454" stroke-width="2.2"/><rect x="275" y="30" width="225" height="150" rx="12" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><rect x="275" y="30" width="225" height="38" rx="12" fill="#0A466B"/><rect x="275" y="52" width="225" height="16" fill="#0A466B"/><text x="289" y="55" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Grades 10 and 11</text><text x="289" y="98" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#0A466B">G.C.E. Ordinary Level</text><text x="289" y="124" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5E5E56">National exam after Grade 11</text><path d="M504 105 l 12 0 m -6 -6 l 6 6 l -6 6" fill="none" stroke="#545454" stroke-width="2.2"/><rect x="520" y="30" width="225" height="150" rx="12" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><rect x="520" y="30" width="225" height="38" rx="12" fill="#112A50"/><rect x="520" y="52" width="225" height="16" fill="#112A50"/><text x="534" y="55" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Grades 12 and 13</text><text x="534" y="98" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#0A466B">G.C.E. Advanced Level</text><text x="534" y="124" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5E5E56">National exam after Grade 13</text><path d="M560 180 L560 206" stroke="#8C013C" stroke-width="2" stroke-dasharray="4 3"/><rect x="500" y="206" width="240" height="74" rx="10" fill="#F6E4EB" stroke="#F6E4EB" stroke-width="1.2"/><text x="514" y="230" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#8C013C">General Information Technology</text><text x="514" y="250" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#263232">For Advanced Level students</text><text x="514" y="268" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#263232">who do not take ICT</text><text x="30" y="230" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#112A50">G.C.E. means General Certificate of Education.</text><text x="30" y="250" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#263232">Both national exams are run by the</text><text x="30" y="268" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#263232">Department of Examinations.</text></svg>
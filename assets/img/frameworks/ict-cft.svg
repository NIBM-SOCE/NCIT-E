<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" role="img" aria-labelledby="t d"><title id="t">UNESCO ICT Competency Framework for Teachers</title><desc id="d">A grid of six aspects of teaching by three levels: Knowledge Acquisition, Knowledge Deepening and Knowledge Creation, giving 18 competencies. The Knowledge Acquisition column, where the Essentials award sits, is highlighted.</desc><rect width="760" height="362" rx="14" fill="#FFFDEE"/><rect x="285" y="24" width="150" height="38" rx="8" fill="#0A466B" stroke="#0A466B" stroke-width="1.2"/><text x="360.0" y="48" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Knowledge Acquisition</text><rect x="443" y="24" width="150" height="38" rx="8" fill="#F5F3F5" stroke="#E3DFCC" stroke-width="1.2"/><text x="518.0" y="48" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#112A50">Knowledge Deepening</text><rect x="601" y="24" width="150" height="38" rx="8" fill="#F5F3F5" stroke="#E3DFCC" stroke-width="1.2"/><text x="676.0" y="48" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#112A50">Knowledge Creation</text><text x="272" y="94" text-anchor="end" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#263232">Understanding ICT in Education Policy</text><rect x="285" y="70" width="150" height="38" rx="7" fill="#E6EEF3" stroke="#0A466B" stroke-width="1.4"/><circle cx="360.0" cy="89.0" r="5" fill="#0A466B"/><rect x="443" y="70" width="150" height="38" rx="7" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1"/><circle cx="518.0" cy="89.0" r="5" fill="#E3DFCC"/><rect x="601" y="70" width="150" height="38" rx="7" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1"/><circle cx="676.0" cy="89.0" r="5" fill="#E3DFCC"/><text x="272" y="138" text-anchor="
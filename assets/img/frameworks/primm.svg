<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 224" role="img" aria-labelledby="t d"><title id="t">PRIMM: five steps for teaching programming</title><desc id="d">Five tiles in order: P for Predict, R for Run, I for Investigate, M for Modify, M for Make.</desc><rect width="760" height="224" rx="14" fill="#FFFDEE"/><rect x="26" y="30" width="128" height="140" rx="12" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><text x="90" y="100" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="54" font-weight="800" fill="#8C013C">P</text><text x="90" y="145" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#0A466B">Predict</text><path d="M157 100 l 10 0 m -5 -5 l 5 5 l -5 5" fill="none" stroke="#5E5E56" stroke-width="2"/><rect x="172" y="30" width="128" height="140" rx="12" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><text x="236" y="100" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="54" font-weight="800" fill="#8C013C">R</text><text x="236" y="145" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#0A466B">Run</text><path d="M303 100 l 10 0 m -5 -5 l 5 5 l -5 5" fill="none" stroke="#5E5E56" stroke-width="2"/><rect x="318" y="30" width="128" height="140" rx="12" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><text x="382" y="100" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="54" font-weight="800" fill="#8C013C">I</text><text x="382" y="145" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#0A466B">Investigate</text><path d="M449 100 l 10 0 m -5 -5 l 5 5 l -5 5" fill="none" stroke="#5E5E56" stroke-width="2"/><rect x="464" y="30" width="128" height="140" rx="12" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><text x="528" y="100" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="54" font-weight="800" fill="#8C013C">M</text><text x="528" y="145" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#0A466B">Modify</text><path d="M595 100 l 10 0 m -5 -5 l 5 5 l -5 5" fill="none" stroke="#5E5E56" stroke-width="2"/><rect x="610" y="30" width="128" height="140" rx="12" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><text x="674" y="100" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="54" font-weight="800" fill="#8C013C">M</text><text x="674" y="145" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#0A466B">Make</text><text x="380" y="204" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#112A50">Read code and predict before you run it. Write your own code last.</text></svg>
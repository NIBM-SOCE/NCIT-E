<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" role="img" aria-labelledby="t d"><title id="t">Syllabus versions used by the programme</title><desc id="d">Grades 6 to 9: NIE material from 2018. Ordinary Level Grade 10: NIE syllabus implemented from 2015. Grade 11: implemented from 2016. Advanced Level: the 2017 NIE syllabus.</desc><rect width="760" height="316" rx="14" fill="#FFFDEE"/><text x="30" y="34" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#112A50">The versions this programme teaches against</text><rect x="30" y="54" width="700" height="46" rx="10" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><rect x="30" y="54" width="8" height="46" rx="3" fill="#545454"/><text x="54" y="83" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#263232">Grades 6 to 9</text><rect x="372" y="64" width="342" height="26" rx="13" fill="#F5F3F5"/><text x="543" y="82" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#263232">NIE material from 2018 (Grade 6)</text><rect x="30" y="110" width="700" height="46" rx="10" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><rect x="30" y="110" width="8" height="46" rx="3" fill="#0A466B"/><text x="54" y="139" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A466B">Ordinary Level, Grade 10</text><rect x="372" y="120" width="342" height="26" rx="13" fill="#F5F3F5"/><text x="543" y="138" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#263232">NIE syllabus implemented from 2015</text><rect x="30" y="166" width="700" height="46" rx="10" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><rect x="30" y="166" width="8" height="46" rx="3" fill="#0A466B"/><text x="54" y="195" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A466B">Ordinary Level, Grade 11</text><rect x="372" y="176" width="342" height="26" rx="13" fill="#F5F3F5"/><text x="543" y="194" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#263232">NIE syllabus implemented from 2016</text><rect x="30" y="222" width="700" height="46" rx="10" fill="#FFFEF8" stroke="#E3DFCC" stroke-width="1.2"/><rect x="30" y="222" width="8" height="46" rx="3" fill="#112A50"/><text x="54" y="251" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#0A466B">Advanced Level, Grades 12 and 13</text><rect x="372" y="232" width="342" height="26" rx="13" fill="#F5F3F5"/><text x="543" y="250" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#263232">NIE syllabus of 2017</text><text x="30" y="300" text-anchor="start" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5E5E56">Every lesson names its version and year. A new published version opens a review of the materials.</text></svg>
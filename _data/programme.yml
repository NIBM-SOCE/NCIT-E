ilos:
  - { n: 1, text: "Plan an ICT lesson for your own grade band, given a versioned syllabus outcome, that moves learners from their prior mental model to the target concept and includes a diagnostic question, a formative check and a low-resource fallback." }
  - { n: 2, text: "Teach a single ICT concept to your own grade band, in a classroom with or without working devices, with no factual error and with the breaking point of every analogy or representation stated to learners." }
  - { n: 3, text: "Diagnose the misconception behind a learner's response to an ICT task, given the response and the grade band, and select a teaching move that addresses the misconception rather than restating the correct answer." }
  - { n: 4, text: "Construct an assessment item and marking scheme for a stated ICT learning objective, matched to the national paper format for your band, that separates learners who hold the target misconception from those who do not." }
  - { n: 5, text: "Apply safe, lawful and ethical practice to a given classroom, online or AI-use scenario, identifying the risk and stating the action a teacher takes." }
  - { n: 6, text: "Locate your own teaching within the national ICT curriculum pathway and the NCIT-E scope of practice, given the syllabus documents for your band, naming the syllabus version taught against and two evidenced development priorities." }
feeds:
  A1: "the objective test"
  A2: "the lesson package"
  A3: "the micro-teach"

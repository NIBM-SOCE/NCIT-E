<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="vt vd"><title id="vt">Syllabus versions during the reform transition</title><desc id="vd">Timeline from 2016 to 2031. The reform transition runs from 2026 to 2031. Advanced Level: the 2017 syllabus is current. Grades 6 to 9: material published from 2018, the most stable band. Ordinary Level: the 2015 and 2016 syllabuses are in use here; Grade 10 reported revised in 2026 while the reform roadmap indicates implementation in 2028, so the version is unconfirmed; a Grade 11 revision is planned for 2027.</desc><rect width="760" height="300" rx="12" fill="#FFFDEE"/><rect x="546.6666666666667" y="34" width="188.33333333333326" height="214" rx="6" fill="#F8F6E8" stroke="#E3DFCC"/><text x="640.8333333333334" y="54" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8C013C">Reform transition 2026 to 2031</text><line x1="170.0" y1="250" x2="170.0" y2="256" stroke="#85857D" stroke-width="1.2"/><text x="170.0" y="276" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" fill="#5E5E56">2016</text><line x1="207.66666666666666" y1="250" x2="207.66666666666666" y2="256" stroke="#85857D" stroke-width="1.2"/><line x1="245.33333333333331" y1="250" x2="245.33333333333331" y2="256" stroke="#85857D" stroke-width="1.2"/><text x="245.33333333333331" y="276" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" fill="#5E5E56">2018</text><line x1="283.0" y1="250" x2="283.0" y2="256" stroke="#85857D" stroke-width="1.2"/><line x1="320.66666666666663" y1="250" x2="320.66666666666663" y2="260" stroke="#85857D" stroke-width="1.2"/><text x="320.66666666666663" y="276" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" fill="#5E5E56">2020</text><line x1="358.33333333333337" y1="2
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="pt pd"><title id="pt">The national ICT pathway</title><desc id="pd">No formal ICT syllabus below Grade 6. Foundation, Grades 6 to 9, leads to G.C.E. Ordinary Level, Grades 10 and 11, which leads to G.C.E. Advanced Level, Grades 12 and 13. General Information Technology runs at Advanced Level for students not taking ICT, introduced at Grade 12 in 2002 and examined nationally from 2005.</desc><rect width="760" height="300" rx="12" fill="#FFFDEE"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#8C013C"/></marker></defs><rect x="12" y="60" width="112" height="120" rx="8" fill="none" stroke="#85857D" stroke-width="1.5" stroke-dasharray="5 5"/><text x="68" y="108" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#5E5E56">Below</text><text x="68" y="126" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#5E5E56">Grade 6: no</text><text x="68" y="144" text-anchor="middle" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#5E5E56">ICT syllabus</text><rect x="140" y="50" width="185" height="140" rx="10" fill="#F5F3F5" stroke="#E3DFCC" stroke-width="1.5"/><rect x="140" y="50" width="185" height="34" rx="10" fill="#545454"/><rect x="140" y="70" width="185" height="14" fill="#545454"/><text x="154" y="72" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Grades 6 to 9</text><text x="154" y="118" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#0A466B">Foundation</text><text x="154" y="146" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#263232">Curriculum subject</text><rect x="345" y="50" width="185" height="140" rx="10" fill="#F5F3F5" stroke="#E3DFCC" stroke-width="1.5"/><rect x="345" y="50" width="185" height="34" rx="10" fill="#545454"/><rect x="345" y="70" width="185" height="14" fill="#545454"/><text x="359" y="72" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Grades 10 and 11</text><text x="359" y="118" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#0A466B">Ordinary Level</text><text x="359" y="146" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#263232">G.C.E. exam in ICT</text><rect x="550" y="50" width="185" height="140" rx="10" fill="#F5F3F5" stroke="#E3DFCC" stroke-width="1.5"/><rect x="550" y="50" width="185" height="34" rx="10" fill="#545454"/><rect x="550" y="70" width="185" height="14" fill="#545454"/><text x="564" y="72" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Grades 12 and 13</text><text x="564" y="118" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#0A466B">Advanced Level</text><text x="564" y="146" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#263232">G.C.E. exam in ICT</text><line x1="126" y1="120" x2="136" y2="120" stroke="#8C013C" stroke-width="2.5" marker-end="url(#ar)"/><line x1="327" y1="120" x2="339" y2="120" stroke="#8C013C" stroke-width="2.5" marker-end="url(#ar)"/><line x1="532" y1="120" x2="544" y2="120" stroke="#8C013C" stroke-width="2.5" marker-end="url(#ar)"/><path d="M560,190 v40 h8" fill="none" stroke="#8C013C" stroke-width="2" stroke-dasharray="4 4"/><rect x="570" y="204" width="180" height="88" rx="10" fill="#F6E4EB"/><text x="584" y="225" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#8C013C">General Information</text><text x="584" y="242" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#8C013C">Technology</text><text x="584" y="262" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#263232">Grade 12 from 2002;</text><text x="584" y="280" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#263232">national exams from 2005</text><text x="140" y="32" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#112A50">This award: open from Grade 6 to Advanced Level</text><path d="M140,40 H735" stroke="#112A50" stroke-width="2"/><path d="M140,36 v8 M735,36 v8" stroke="#112A50" stroke-width="2"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-labelledby="ht hd"><title id="ht">150 notional hours</title><desc id="hd">One bar of 150 notional hours: 45 contact hours and 15 practical hours make 60 guided hours; 90 hours are independent study.</desc><rect width="760" height="190" rx="12" fill="#FFFDEE"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#E6EEF3"/><path d="M0 4h8" stroke="#9DB9CB" stroke-width="2"/></pattern></defs><rect x="30" y="62" width="208.0" height="56" rx="6" fill="#0A466B"/><text x="42" y="96" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">45 contact</text><rect x="240.0" y="62" width="68.0" height="56" rx="6" fill="#8C013C"/><text x="252.0" y="96" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">15</text><rect x="310.0" y="62" width="418.0" height="56" rx="6" fill="url(#hatch)"/><text x="322.0" y="96" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#112A50">90 independent study</text><path d="M30,50 v-8 h278.0 v8" fill="none" stroke="#112A50" stroke-width="1.8"/><text x="30" y="30" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#112A50">60 guided hours with a tutor</text><path d="M310.0,50 v-8 h418.0 v8" fill="none" stroke="#112A50" stroke-width="1.8"/><text x="310.0" y="30" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#112A50">90 hours between sessions</text><text x="244.0" y="136" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8C013C">practical</text><text x="30" y="160" font-family="'Open Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#263232">3 SLQF credits (150 notional hours). About 6 independent hours a week over 15 teaching weeks.</text></svg>